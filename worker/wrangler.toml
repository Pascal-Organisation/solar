# PIN gate in front of the Access-protected dashboard. See worker/README.md.
name = "solar-pin"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
routes = [{ pattern = "solar.pascalhaag.de/*", zone_name = "pascalhaag.de" }]

[vars]
ORIGIN_HOST = "solar-origin.pascalhaag.de"
SESSION_DAYS = "30"

# 5 PIN attempts per IP per minute.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (wrangler secret put ...): PIN, COOKIE_KEY, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
