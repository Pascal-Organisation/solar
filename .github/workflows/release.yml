name: Release

# main -> CI gate -> build + scan -> publish to GHCR -> keyless cosign signature.
# The host's deployer (deploy/solar-deploy.sh) only runs images whose signature
# identity is exactly this workflow on refs/heads/main.
#
# Job split by privilege:
#   build — packages:write, runs the scanners against a tar. No id-token, so no
#           step in it can mint a Sigstore OIDC token.
#   sign  — id-token:write, runs only cosign. No third-party scanners.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build, scan, publish
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # org.opencontainers.image.created is load-bearing: the deployer refuses any
      # image not built strictly later than the one running.
      - name: Build
        run: |
          echo "LOCAL=solar-release:${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "TAR=${RUNNER_TEMP}/image.tar" >> "$GITHUB_ENV"
          docker build --target runtime \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "solar-release:${GITHUB_RUN_ID}" .
          docker save "solar-release:${GITHUB_RUN_ID}" -o "${RUNNER_TEMP}/image.tar"

      - name: Trivy (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v "$TAR:/img.tar:ro" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --input /img.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table

      - name: SBOM
        run: |
          docker run --rm -v "$TAR:/img.tar:ro" \
            anchore/syft@sha256:473a60e3a58e29aca3aedb3e99e787bb4ef273917e44d10fcbea4330a07320bb \
            docker-archive:/img.tar -o spdx-json > "${RUNNER_TEMP}/sbom.spdx.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom.spdx.json
          if-no-files-found: error
          retention-days: 1

      # What goes public is the very image Trivy scanned — tag + push, never a rebuild.
      - id: push
        name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in latest "sha-${GITHUB_SHA}"; do
            docker tag "$LOCAL" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:latest" \
            | grep "^${IMAGE}@" | head -1 | cut -d@ -f2)"
          [ -n "$digest" ] || { echo "::error::could not resolve the pushed digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker logout ghcr.io

  sign:
    name: Sign & attest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and attest SBOM
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
          docker logout ghcr.io

      - name: Verify like the host does
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
          echo "Released ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
