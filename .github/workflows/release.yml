name: Release

# main -> CI gate (tests + org security gates) -> build, Trivy, SBOM, GHCR, keyless
# cosign signature + SBOM/SLSA attestations, all via
# Pascal-Organisation/security-pipeline (build-container.yml).
#
# Deploy is pull-based: on the host, `app-deploy solar` (systemd timer) only runs
# images signed by security-pipeline's build-container.yml for THIS repository on
# refs/heads/main, carrying both attestations, built later than what runs.
# Public repo: no self-hosted runner, no deploy runner, CI holds no credential to the host.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read # CodeQL (security job inside ci.yml)
      security-events: write # CodeQL results

  build:
    needs: ci
    uses: Pascal-Organisation/security-pipeline/.github/workflows/build-container.yml@bed606950489a2d5af437058445d712aa7a9fe6f # v0.4.0
    permissions:
      contents: read
      packages: write # push image, signature and attestations to GHCR
      id-token: write # keyless cosign signature (public repo)
    with:
      target: runtime
