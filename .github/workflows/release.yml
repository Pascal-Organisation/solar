name: Release

# main -> tests -> security-pipeline: release policy, gate, build, scan, SBOM, GHCR, keyless
# cosign signature + SBOM/SLSA attestations, all via
# Pascal-Organisation/security-pipeline (build-container.yml).
#
# Deploy is pull-based: on the host, `app-deploy solar` (systemd timer) only runs
# images signed by security-pipeline's build-container.yml for THIS repository on
# refs/heads/main, carrying both attestations, built later than what runs.
# Public repo: no self-hosted runner, no deploy runner, CI holds no credential to the host.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read # CodeQL (security job inside ci.yml)
      security-events: write # CodeQL results

  build:
    needs: ci
    uses: Pascal-Organisation/security-pipeline/.github/workflows/build-container.yml@bb14b2d727472e34dc6c8f30ef1e178d3dbb9fc0 # v2.0.0
    permissions:
      contents: read
      actions: read # CodeQL (public repos), inside the gate
      security-events: write # CodeQL results
      pull-requests: read # release policy: was this commit a merged PR?
      packages: write # push image, signature and attestations to GHCR
      id-token: write # keyless signature
    with:
      target: runtime
      sast-languages: python,javascript-typescript,actions
