name: CI

# Public repository: everything runs on GitHub-hosted runners. Self-hosted runners
# must never execute workflows that a fork's pull request can trigger.
on:
  pull_request:
  push:
    branches-ignore: [main] # main is gated by release.yml, which calls this workflow
  workflow_call:
    inputs:
      skip_security:
        description: "true in release.yml: build-container.yml runs the same gate itself"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_IMAGE: python:3.15-slim-trixie@sha256:8c13a3f37a6a5b71498228e902c4b9f51c1f7900d49fabf71f9a650c6120e0d0

jobs:
  # Org-wide gates from Pascal-Organisation/security-pipeline.
  # Public repo -> the reusable workflow forces GitHub-hosted runners.
  security:
    name: Security
    # Skipped only when release.yml calls this workflow: the release runs the gate itself,
    # and only that run counts (its signature is what the host checks). Unset on PRs and
    # pushes, and null != true, so it runs there (null == false would skip it).
    if: ${{ inputs.skip_security != true }}
    uses: Pascal-Organisation/security-pipeline/.github/workflows/ci.yml@b02ec21a3e621d841994dacfe4ddf8974c8287f3 # v3.0.0
    permissions:
      contents: read
      actions: read # CodeQL needs workflow run metadata
      security-events: write # upload CodeQL results
      packages: read # pull the private ci-toolbox (GitHub-hosted path)
    with:
      sast-languages: python,javascript-typescript,actions
      dockerfile: Dockerfile

  test:
    name: Lint & test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tests run inside the same pinned Python image the release uses, with the
      # hash-locked runtime dependencies — no setup-python action needed.
      - name: Ruff and pytest
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:ro" -w /src "$PYTHON_IMAGE" sh -euc '
            python -m venv /tmp/v
            /tmp/v/bin/pip install -q --require-hashes --no-deps -r requirements.lock
            /tmp/v/bin/pip install -q pytest==9.1.1 ruff==0.17.0
            /tmp/v/bin/ruff check --no-cache src tests tools
            /tmp/v/bin/python -m pytest -q -p no:cacheprovider
          '

      - name: Frontend syntax check
        run: node --check web/app.js

      - name: Shell scripts
        run: shellcheck deploy/*.sh

      - name: Image builds
        run: docker build -t solar-ci .
