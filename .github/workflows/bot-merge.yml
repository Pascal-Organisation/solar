## Merges green Dependabot PRs.
##
## GitHub's native auto-merge needs a public repo or a paid plan, so this does the same
## job: every 30 minutes it squash-merges each open PR that Dependabot opened from a
## dependabot/* branch of this repo, once GitHub reports it `clean` AND the script has
## confirmed that the required checks (REQUIRED_CHECKS below) succeeded on that exact
## head SHA. Nothing else is touched — never a human's PR, never a fork's — and the
## merge is pinned to the checked head SHA.
##
## Scheduled, deliberately not workflow_run (the trigger zizmor flags as dangerous);
## it checks out main only, never a PR. Pause everything by setting the repository
## variable AUTOMERGE_ENABLED to "false". A failed run is emailed by GitHub
## (Settings -> Notifications -> Actions), which is the alert channel.
name: Bot merge

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bot-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge green bot PRs
    if: ${{ vars.AUTOMERGE_ENABLED != 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # merge
      pull-requests: write # merge
      checks: read         # list the check-runs of the head SHA before merging
      actions: write       # dispatch the release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECKS: "Lint & test"
          RELEASE_WORKFLOW: "release.yml"
        run: |
          python3 .github/scripts/bot_merge.py
