## Weekly, independent of pushes: full-history secret scan and fresh CVE data.
## A separate file, so that the schedule can never trigger a release or a deploy.
name: Weekly security

on:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  security:
    name: Security
    uses: Pascal-Organisation/security-pipeline/.github/workflows/ci.yml@dc0bbef5b6735f84a5d147c37d2e62c30be095b0 # v3.2.0
    # Ceiling for the nested jobs; each declares its own narrower permissions.
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read # pull the private ci-toolbox (GitHub-hosted path)
    with:
      sast-languages: python,javascript-typescript,actions
      dockerfile: Dockerfile

  # The released image against today's CVE data; a release was only clean on build day.
  image-rescan:
    name: Image re-scan
    uses: Pascal-Organisation/security-pipeline/.github/workflows/image-rescan.yml@dc0bbef5b6735f84a5d147c37d2e62c30be095b0 # v3.2.0
    permissions:
      packages: read
