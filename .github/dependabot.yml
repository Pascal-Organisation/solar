version: 2
updates:
  # Merged automatically once green (bot-merge.yml), so every ecosystem has a cooldown:
  # a freshly published, possibly compromised release is not proposed at once.
  # Security updates ignore the cooldown.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
    commit-message: { prefix: ci }
    cooldown: { default-days: 7 }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 3 }
