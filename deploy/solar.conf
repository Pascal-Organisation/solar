# /etc/app-deploy/solar.conf — root:root 0644. Read by app-deploy
# (https://github.com/Pascal-Organisation/security-pipeline/blob/main/deployer/app-deploy).
#
# Public repo -> keyless verification: the image must be signed by security-pipeline's
# build-container.yml for Pascal-Organisation/solar on refs/heads/main and carry the
# CycloneDX SBOM + SLSA provenance attestations.
IMAGE=ghcr.io/pascal-organisation/solar
REPOSITORY=Pascal-Organisation/solar
VERIFY_MODE=keyless

DEPLOY_DIR=/srv/solar
SERVICES="collector web"

# historic names, compose reads ${SOLAR_IMAGE} from /srv/solar/image.env
IMAGE_VAR=SOLAR_IMAGE
BUILT_VAR=SOLAR_BUILT_AT

# compose changes ship inside the verified image
COMPOSE_FROM_IMAGE=/app/deploy/docker-compose.yml
BACKUP_HOOK=/usr/local/bin/solar-backup.sh
HEALTH_TIMEOUT=300
MAX_RESTARTS=3
