[project]
name = "solar"
version = "0.1.0"
description = "Local-first dashboard for a GoodWe hybrid inverter — no vendor cloud required."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "goodwe==0.4.10",
  "fastapi==0.162.0",
  "starlette==1.9.0",
  "uvicorn==0.54.0",
  "prometheus-client==0.26.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3"]

[project.scripts]
solar = "solar.__main__:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["S311"]
